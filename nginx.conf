# /etc/nginx/sites-available/informatenecochea

# ── FRONTEND ─────────────────────────────────────────────────
server {
    listen 80;
    server_name informatenecochea.com www.informatenecochea.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── BACKEND API ───────────────────────────────────────────────
server {
    listen 80;
    server_name api.informatenecochea.com;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── ADMIN ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.informatenecochea.com;

    root /var/www/informatenecochea/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
